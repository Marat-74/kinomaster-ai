
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Киномастер — части тела</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#171923;color:#fff;font-family:Arial,sans-serif}
h2{font-size:22px}
p{line-height:1.5;color:#cbd0df}
button,.upload{display:inline-block;padding:12px 16px;margin:5px 3px;border:0;border-radius:9px;background:#3978e8;color:white;font-size:15px}
button:disabled{opacity:.4}
canvas{display:block;width:100%;height:auto;touch-action:none;background-color:#333;background-image:linear-gradient(45deg,#444 25%,transparent 25%),linear-gradient(-45deg,#444 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#444 75%),linear-gradient(-45deg,transparent 75%,#444 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.panel{background:#252938;padding:13px;border-radius:12px;margin:12px 0}
#status{color:#9fe6b0;min-height:24px}
input{max-width:100%}
</style>
</head>
<body>
<h2>Киномастер-Ай 2.0</h2>
<h3>Разделение персонажа на части</h3>
<p>Шаг 1. Загрузи PNG Петровича с прозрачным фоном.</p>

<div class="panel">
<label class="upload">
Загрузить PNG
<input id="file" type="file" accept="image/png,image/*" hidden>
</label>
</div>

<p>Шаг 2. Пальцем обведи прямоугольником область головы. Старайся не захватывать туловище.</p>

<div class="panel">
<canvas id="canvas"></canvas>
</div>

<div>
<button id="reset" disabled>Сбросить выделение</button>
<button id="save" disabled>Сохранить голову PNG</button>
</div>

<div class="panel">
<p id="status">Ожидаю изображение.</p>
</div>

<script>
const file=document.getElementById('file');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
const save=document.getElementById('save');
const reset=document.getElementById('reset');

let img=null;
let selection=null;
let start=null;
let dragging=false;

function draw(){
  if(!img)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  if(selection){
    ctx.save();
    ctx.strokeStyle="#00e5ff";
    ctx.lineWidth=Math.max(2,canvas.width/300);
    ctx.setLineDash([8,5]);
    ctx.strokeRect(selection.x,selection.y,selection.w,selection.h);
    ctx.fillStyle="rgba(0,229,255,.12)";
    ctx.fillRect(selection.x,selection.y,selection.w,selection.h);
    ctx.restore();
  }
}

file.addEventListener('change',()=>{
  const f=file.files[0];
  if(!f)return;
  const url=URL.createObjectURL(f);
  const image=new Image();
  image.onload=()=>{
    img=image;
    canvas.width=image.naturalWidth;
    canvas.height=image.naturalHeight;
    selection=null;
    draw();
    save.disabled=true;
    reset.disabled=false;
    status.textContent="Изображение загружено. Выдели голову пальцем.";
    URL.revokeObjectURL(url);
  };
  image.onerror=()=>{
    status.textContent="Не удалось открыть изображение.";
    URL.revokeObjectURL(url);
  };
  image.src=url;
});

function point(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*canvas.width/r.width,
    y:(e.clientY-r.top)*canvas.height/r.height
  };
}

canvas.addEventListener('pointerdown',e=>{
  if(!img)return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  start=point(e);
  selection={x:start.x,y:start.y,w:0,h:0};
  dragging=true;
  draw();
});

canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  e.preventDefault();
  const p=point(e);
  selection={
    x:Math.min(start.x,p.x),
    y:Math.min(start.y,p.y),
    w:Math.abs(p.x-start.x),
    h:Math.abs(p.y-start.y)
  };
  draw();
});

function finish(){
  if(!dragging)return;
  dragging=false;
  if(selection && selection.w>5 && selection.h>5){
    save.disabled=false;
    status.textContent="Область выделена. Проверь, что в неё попала вся голова.";
  }else{
    selection=null;
    save.disabled=true;
    status.textContent="Слишком маленькая область. Попробуй ещё раз.";
  }
  draw();
}
canvas.addEventListener('pointerup',finish);
canvas.addEventListener('pointercancel',finish);

reset.addEventListener('click',()=>{
  selection=null;
  save.disabled=true;
  draw();
  status.textContent="Выделение сброшено.";
});

save.addEventListener('click',()=>{
  if(!img||!selection)return;
  const x=Math.max(0,Math.floor(selection.x));
  const y=Math.max(0,Math.floor(selection.y));
  const right=Math.min(canvas.width,Math.ceil(selection.x+selection.w));
  const bottom=Math.min(canvas.height,Math.ceil(selection.y+selection.h));
  const w=right-x,h=bottom-y;
  if(w<1||h<1)return;

  const out=document.createElement('canvas');
  out.width=w;
  out.height=h;
  out.getContext('2d').drawImage(img,x,y,w,h,0,0,w,h);

  out.toBlob(blob=>{
    if(!blob){
      status.textContent="Не удалось сохранить PNG.";
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='Petrovich-head.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    status.textContent="Голова сохранена в PNG!";
  },'image/png');
});
</script>
</body>
</html>
