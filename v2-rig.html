
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Киномастер-Ай 2.0 — Auto-Rig</title>
<style>
body{margin:0;background:#171b25;color:#fff;font-family:Arial;padding:16px}
h2{color:#7ee0bd}
button,select{padding:12px;border:0;border-radius:8px;margin:5px;background:#34445c;color:white}
canvas{width:100%;max-width:700px;background:#252e40;border:1px solid #52627b;border-radius:10px;touch-action:none}
.panel{background:#222b3b;padding:14px;border-radius:12px;margin:12px 0}
small{color:#aab8ca}
</style>
</head>
<body>
<h2>Киномастер-Ай 2.0</h2>
<h3>Универсальный Auto-Rig</h3>

<div class="panel">
<label>Персонаж:</label>
<select id="character">
<option value="">Выбрать из библиотеки</option>
</select>
<button onclick="loadCharacters()">Обновить библиотеку</button>
<p id="status">Проверка библиотеки…</p>
</div>

<div class="panel">
<label>Тип скелета:</label>
<select id="type" onchange="createRig()">
<option value="human">Человек</option>
<option value="bird">Птица</option>
<option value="animal">Четвероногое</option>
</select>
<button onclick="createRig()">Создать скелет</button>
</div>

<div class="panel">
<canvas id="canvas" width="700" height="500"></canvas>
<p><small>Перетаскивай суставы пальцем или мышью.</small></p>
</div>

<div class="panel">
<button onclick="saveRig()">Сохранить скелет</button>
<button onclick="testMove()">Проверить движение</button>
<p id="result"></p>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let joints=[];
let selected=-1;

function createRig(){
 const type=document.getElementById('type').value;
 if(type==='human'){
 joints=[
 {n:'Таз',x:350,y:260},
 {n:'Грудь',x:350,y:180},
 {n:'Голова',x:350,y:100},
 {n:'Левое плечо',x:290,y:185},
 {n:'Левый локоть',x:245,y:260},
 {n:'Левая кисть',x:220,y:320},
 {n:'Правое плечо',x:410,y:185},
 {n:'Правый локоть',x:455,y:260},
 {n:'Правая кисть',x:480,y:320},
 {n:'Левое колено',x:315,y:355},
 {n:'Левая стопа',x:300,y:445},
 {n:'Правое колено',x:385,y:355},
 {n:'Правая стопа',x:400,y:445}
 ];
 }
 if(type==='bird'){
 joints=[
 {n:'Корпус',x:350,y:260},
 {n:'Голова',x:350,y:140},
 {n:'Клюв',x:420,y:145},
 {n:'Левое крыло',x:250,y:220},
 {n:'Правое крыло',x:450,y:220},
 {n:'Лапа левая',x:320,y:390},
 {n:'Лапа правая',x:380,y:390}
 ];
 }
 if(type==='animal'){
 joints=[
 {n:'Корпус',x:350,y:240},
 {n:'Голова',x:500,y:170},
 {n:'Передняя левая',x:280,y:350},
 {n:'Передняя правая',x:390,y:350},
 {n:'Задняя левая',x:170,y:350},
 {n:'Задняя правая',x:230,y:350},
 {n:'Хвост',x:100,y:210}
 ];
 }
 draw();
}

function draw(){
 ctx.clearRect(0,0,700,500);
 ctx.strokeStyle='#7ee0bd';
 ctx.lineWidth=5;
 const links=[[0,1],[1,2],[1,3],[3,4],[4,5],[1,6],[6,7],[7,8],[0,9],[9,10],[0,11],[11,12]];
 joints.forEach((j,i)=>{
  const parent=links.find(l=>l[1]===i);
  if(parent){
   const p=joints[parent[0]];
   ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(j.x,j.y);ctx.stroke();
  }
 });
 joints.forEach((j,i)=>{
  ctx.beginPath();
  ctx.fillStyle=i===selected?'#ffca67':'#64cdb1';
  ctx.arc(j.x,j.y,11,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='white';
  ctx.font='12px Arial';
  ctx.fillText(j.n,j.x+13,j.y-8);
 });
}

function pointer(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)*700/r.width,y:(e.clientY-r.top)*500/r.height};
}
canvas.addEventListener('pointerdown',e=>{
 const p=pointer(e);
 selected=joints.findIndex(j=>Math.hypot(j.x-p.x,j.y-p.y)<22);
 canvas.setPointerCapture(e.pointerId);
 draw();
});
canvas.addEventListener('pointermove',e=>{
 if(selected<0)return;
 const p=pointer(e);
 joints[selected].x=p.x;
 joints[selected].y=p.y;
 draw();
});
canvas.addEventListener('pointerup',()=>selected=-1);
canvas.addEventListener('pointercancel',()=>selected=-1);

function saveRig(){
 const id=document.getElementById('character').value||'default';
 localStorage.setItem('kinoRig_'+id,JSON.stringify(joints));
 document.getElementById('result').textContent='Скелет сохранён отдельно от старой библиотеки.';
}

function testMove(){
 document.getElementById('result').textContent=
 'Суставы готовы к настройке. Полная анимация будет подключена следующим этапом.';
}

function loadCharacters(){
 try{
  const data=JSON.parse(localStorage.getItem('kinoCharacters')||'[]');
  const select=document.getElementById('character');
  select.innerHTML='<option value="">Выбрать персонажа</option>';
  if(Array.isArray(data)){
   data.forEach((item,i)=>{
    const name=typeof item==='string'?item:(item.name||item.title||'Персонаж '+(i+1));
    const opt=document.createElement('option');
    opt.value=String(i);
    opt.textContent=name;
    select.appendChild(opt);
   });
  }
  document.getElementById('status').textContent=
   'Найдено персонажей: '+(Array.isArray(data)?data.length:0);
 }catch(e){
  document.getElementById('status').textContent='Не удалось прочитать библиотеку.';
 }
}

createRig();
loadCharacters();
</script>
</body>
</html>
